# Settings come from .env; see docs/api.md (Configuration) and .env.example.
# Ledger files and access.json live in the budget-data volume. herald routes
# Caddy to the exposed port; add `ports: ["4000:4000"]` to reach it locally.
services:
  budget:
    build:
      context: .
      args:
        VERSION: ${BUDGET_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    expose:
      - "4000"
    volumes:
      - budget-data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  budget-data:
