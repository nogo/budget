# Settings come from .env; see docs/api.md (Configuration). At least
# BUDGET_SESSION_SECRET, BUDGET_BASE_URL and OIDC_ISSUER, OIDC_CLIENT_ID,
# OIDC_CLIENT_SECRET. Ledger files and access.json live in the volume.
services:
  budget:
    build:
      context: .
      args:
        VERSION: ${BUDGET_VERSION:-dev}
    env_file:
      - .env
    environment:
      BUDGET_DATA: /data
    ports:
      - "4000:4000"
    volumes:
      - budget-data:/data
    restart: unless-stopped

volumes:
  budget-data:
